<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The first page of the PKN website." />
    <title>Hello world | PKN</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f3ed;
        color: #173c31;
        font-family: system-ui, sans-serif;
      }
      main { width: min(100%, 720px); }
      .label { font-size: 14px; font-weight: 700; letter-spacing: .18em; }
      h1 { margin: 24px 0; font-size: clamp(52px, 12vw, 100px); line-height: 1; letter-spacing: -.06em; }
      p { max-width: 480px; font-size: 20px; line-height: 1.6; }
      .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 32px; font-size: 14px; }
      .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #287a50; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">PKN / FIRST PAGE</span>
      <h1>Hello world.</h1>
      <p>Every website starts somewhere. This is ours.</p>
      <span class="status">Your test page is working.</span>
    </main>
  </body>
</html>
